# Builds restic + Vandelay into one image for MainThrive's nightly per-account mail backup. Nothing
# is changed in either tool: restic is its official image, Vandelay its released binary, checked
# against the release's published sha256 (and that sha256 is pinned here, so a re-uploaded asset fails).
# The image is built and checked locally and pushed last, so a failing build publishes nothing. The release tag is pushed
# only from main, and only once: a tag that already exists is never re-pushed, so changing what is built means a new
# RESTIC_VERSION or VANDELAY_VERSION (the tag is made of both). A dispatch from another branch pushes branch-<short sha>
# instead, and a pull request runs every step but the registry login and the push (MainThrive MAI-1021).
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml", "Dockerfile"]
  # No path filter: this job is the required check on main, and a check filtered out of a pull
  # request never reports, so that pull request could never merge.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# One group per ref: main builds one at a time and never cancels, and each pull request
# (refs/pull/N/merge) has its own group, where a new push cancels its older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RESTIC_IMAGE: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
  RESTIC_VERSION: 0.19.1
  VANDELAY_VERSION: 1.0.11
  VANDELAY_SHA256: 5e9de1c693148d5a44cb639f0e1238b1d82b8a36ee781dc66ef4ae00abdac774
  IMAGE: ghcr.io/bill-scheffer/mail-backup
  # Appended to the tag. A change to what is built that moves neither version sets a new one (e.g. "-b2"), because a
  # tag is pushed once and never re-pushed.
  TAG_SUFFIX: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Upstream still publishes the pinned checksum
        run: |
          set -eu
          got=$(wget -qO- "https://github.com/stalwartlabs/vandelay/releases/download/v${VANDELAY_VERSION}/vandelay-x86_64-unknown-linux-musl.tar.gz.sha256" | cut -d' ' -f1)
          [ "$got" = "$VANDELAY_SHA256" ] || { echo "::error::vandelay v${VANDELAY_VERSION} publishes ${got}, pinned ${VANDELAY_SHA256}"; exit 1; }

      # ⛔ A release tag names one image, forever (MAI-1021). A main build that re-pushed it would change what the
      # backup CronJobs run, or leave the digest they pin untagged, and an untagged version is the first thing a
      # registry cleanup deletes. So a tag that already exists is never re-pushed, and a change to what goes into the
      # image needs a new tag (TAG_SUFFIX, or a new version); this fails a pull request that makes one without it. What
      # goes in: the Dockerfile, the repo's other files once the Dockerfile copies or mounts anything from the context,
      # the env: values, and every step up to and including the image build. Left out: comments, step names,
      # push:/load:, the registry login, TAG_SUFFIX (a new one is a new tag) and this step; none can change the image,
      # and the build step is held to push: false, so the push step below is the only way out.
      # The package is public, so this reads it without logging in.
      - name: The release tag is new, or already names this content (it is never re-pushed)
        id: release
        run: |
          set -eu
          tag="restic${RESTIC_VERSION}-vandelay${VANDELAY_VERSION}${TAG_SUFFIX}"
          if ! have=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}} {{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>&1); then
            case "$have" in *": not found"*) ;; *) echo "::error::cannot read ${IMAGE}:${tag}: ${have}"; exit 1 ;; esac
            echo "${tag} is new: a main build publishes it"
            echo publish=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r digest rev <<< "$have"
          [[ "${rev:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::${IMAGE}:${tag} carries no revision label (got '${have}')"; exit 1; }
          git fetch -q --depth=1 origin "$rev"
          # build.yml from env: through the step that uses docker/build-push-action, minus what cannot change the image.
          inputs_of() {
            git show "$1:.github/workflows/build.yml" | awk '
              /^env:/ { on = 1 }
              /^      - / { if (build) exit; skip = /name: The release tag is new/ || /uses: docker\/login-action/ }
              /^[[:space:]]*(- )?uses: docker\/build-push-action/ { build = 1 }
              on && !skip && !/^[[:space:]]*(#|$)/ && !/^[[:space:]]*(- )?name:/ && !/^[[:space:]]*(push|load):/ && !/^  TAG_SUFFIX:/'
          }
          # Since push: and the login are left out above, the build step itself must never push: only the push step
          # below, which reads this step's verdict, may.
          git show HEAD:.github/workflows/build.yml | awk '/^      - / { if (build) exit } /^[[:space:]]*(- )?uses: docker\/build-push-action/ { build = 1 } build' \
            | grep -qE '^[[:space:]]+push: false$' || { echo "::error::the image build step must say push: false"; exit 1; }
          # The build context is this repo. Nothing in it reaches the image today; once the Dockerfile copies or mounts
          # anything from the context, every file but docs and workflows counts (fail closed, no parsing).
          inputs="Dockerfile"
          if git show HEAD:Dockerfile | grep -Eiv -- '--from=' | grep -Eiq '^[[:space:]]*(COPY|ADD)[[:space:]]|--mount=[^ ]*type=bind'; then
            inputs=". :!*.md :!LICENSE :!.github"
          fi
          changed=$(git diff --name-only "$rev" HEAD -- $inputs)
          [ "$(inputs_of "$rev")" = "$(inputs_of HEAD)" ] || changed="${changed} build.yml"
          if [ -n "$changed" ]; then
            echo "::error::${tag} already names ${digest}, built from ${rev}, and what goes into the image changed since:" $changed "-- the tag must change"
            exit 1
          fi
          echo "${tag} already names ${digest}, built from ${rev}; nothing that goes into the image changed, so it is not re-pushed"
          echo publish=false >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build (loaded locally, not pushed yet)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: |
            RESTIC_IMAGE=${{ env.RESTIC_IMAGE }}
            VANDELAY_VERSION=${{ env.VANDELAY_VERSION }}
            VANDELAY_SHA256=${{ env.VANDELAY_SHA256 }}
          tags: |
            ${{ env.IMAGE }}:restic${{ env.RESTIC_VERSION }}-vandelay${{ env.VANDELAY_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=restic${{ env.RESTIC_VERSION }}-vandelay${{ env.VANDELAY_VERSION }}
            org.opencontainers.image.description=restic ${{ env.RESTIC_VERSION }} with Stalwart Vandelay ${{ env.VANDELAY_VERSION }}
            org.opencontainers.image.licenses=BSD-2-Clause AND (Apache-2.0 OR MIT)

      # ⛔ Every check runs on the LOCAL image and the push comes last, so a failing build publishes nothing.
      - name: The built image runs both tools at the pinned versions
        run: |
          set -eu
          ref="${IMAGE}:restic${RESTIC_VERSION}-vandelay${VANDELAY_VERSION}"
          docker run --rm "$ref" restic version | grep -q "restic ${RESTIC_VERSION} "
          docker run --rm "$ref" vandelay --version | grep -qx "vandelay ${VANDELAY_VERSION}"
          docker run --rm "$ref" sh -c 'command -v jq && command -v wget' >/dev/null

      # ⛔ The release tag is pushed only from main (a push, or a dispatch on main). A dispatch from any other branch
      # pushes the same tested image under branch-<short sha> alone, never the release tag. A pull request never logs
      # in or pushes.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push, only after the check passed
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          set -eu
          # The build tags the image locally without TAG_SUFFIX; the published tag carries it.
          built="${IMAGE}:restic${RESTIC_VERSION}-vandelay${VANDELAY_VERSION}"
          tag="restic${RESTIC_VERSION}-vandelay${VANDELAY_VERSION}${TAG_SUFFIX}"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            tag="branch-${GITHUB_SHA::7}"
          elif [ "$PUBLISH" != true ]; then
            echo "${tag} already exists and is never re-pushed: built and checked, nothing pushed"
            echo "### ${IMAGE}: \`${tag}\` already exists and is never re-pushed; this run built and checked, and pushed nothing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$built" = "${IMAGE}:${tag}" ] || docker tag "$built" "${IMAGE}:${tag}"
          docker push "${IMAGE}:${tag}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${tag}")
          echo "pushed ${digest}"
          {
            echo "### ${IMAGE}"
            echo "- tag: \`${tag}\` (from \`${GITHUB_REF}\` @ \`${GITHUB_SHA}\`)"
            echo "- digest: \`${digest#*@}\`"
          } >> "$GITHUB_STEP_SUMMARY"
