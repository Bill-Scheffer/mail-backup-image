# Builds restic + Vandelay into one image for MainThrive's nightly per-account mail backup. Nothing
# is changed in either tool: restic is its official image, Vandelay its released binary, checked
# against the release's published sha256 (and that sha256 is pinned here, so a re-uploaded asset fails).
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/build.yml", "Dockerfile"]

permissions:
  contents: read
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  RESTIC_IMAGE: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
  RESTIC_VERSION: 0.19.1
  VANDELAY_VERSION: 1.0.11
  VANDELAY_SHA256: 5e9de1c693148d5a44cb639f0e1238b1d82b8a36ee781dc66ef4ae00abdac774
  IMAGE: ghcr.io/bill-scheffer/mail-backup

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Upstream still publishes the pinned checksum
        run: |
          set -eu
          got=$(wget -qO- "https://github.com/stalwartlabs/vandelay/releases/download/v${VANDELAY_VERSION}/vandelay-x86_64-unknown-linux-musl.tar.gz.sha256" | cut -d' ' -f1)
          [ "$got" = "$VANDELAY_SHA256" ] || { echo "::error::vandelay v${VANDELAY_VERSION} publishes ${got}, pinned ${VANDELAY_SHA256}"; exit 1; }

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            RESTIC_IMAGE=${{ env.RESTIC_IMAGE }}
            VANDELAY_VERSION=${{ env.VANDELAY_VERSION }}
            VANDELAY_SHA256=${{ env.VANDELAY_SHA256 }}
          tags: |
            ${{ env.IMAGE }}:restic${{ env.RESTIC_VERSION }}-vandelay${{ env.VANDELAY_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=restic${{ env.RESTIC_VERSION }}-vandelay${{ env.VANDELAY_VERSION }}
            org.opencontainers.image.description=restic ${{ env.RESTIC_VERSION }} with Stalwart Vandelay ${{ env.VANDELAY_VERSION }}
            org.opencontainers.image.licenses=BSD-2-Clause AND (Apache-2.0 OR MIT)

      - name: The pushed image runs both tools at the pinned versions
        run: |
          set -eu
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run --rm "$ref" restic version | grep -q "restic ${RESTIC_VERSION} "
          docker run --rm "$ref" vandelay --version | grep -qx "vandelay ${VANDELAY_VERSION}"
          docker run --rm "$ref" sh -c 'command -v jq && command -v wget' >/dev/null
          {
            echo "### ${IMAGE}"
            echo "- tag: \`restic${RESTIC_VERSION}-vandelay${VANDELAY_VERSION}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
